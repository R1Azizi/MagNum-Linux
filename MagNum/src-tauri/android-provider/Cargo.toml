[package]
name = "tauri-plugin-android-provider"
version = "0.2.0"
edition = "2024"
links = "tauri-plugin-android-provider"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = "2"
serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
magnum-core = { path = "../magnum-core" }
magnum-fs = { path = "../magnum-fs" }
mlua = { version = "0.11.6", features = ["lua54", "vendored"] }
